name: Bug report
description: plan-staged-rollout isn't working as expected.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part is affected?
      options:
        - /plan-stages (bootstrap)
        - /plan-run (stage execution)
        - /plan-close (closeout)
        - SessionStart hook
        - Install / marketplace
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs. actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Environment
      description: Claude Code version, plugin version, and OS.
      placeholder: "e.g. Claude Code 2.x, plugin 0.4.0, macOS 15"
    validations:
      required: false
