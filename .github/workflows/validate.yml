name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/validate_plugin.py
