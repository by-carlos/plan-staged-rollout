<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 470" width="1150" height="470" role="img" aria-label="What a driver runs on its own: gate auto is fired unattended, while gate human, local and live are skipped for you to run, and the driver carries on either way.">
<title>What a driver runs on its own</title>
<desc>A stage whose dependencies are done meets its gate. gate auto is fired as its own cloud session, which works, opens the stage PR and merges it. gate human, gate local and gate live are skipped and left for you to run yourself. The driver moves on to the next stage either way.</desc>

<rect x="0" y="0" width="1150" height="470" fill="#F8EFE4"/>
<rect x="1" y="1" width="1148" height="468" fill="none" stroke="#E2D2BE" stroke-width="2"/>

<defs>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A7664"/>
  </marker>
</defs>

<g font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">

<!-- column captions -->
<g fill="#8A7664" font-size="12" letter-spacing="1.2">
  <text x="320" y="46">THE STAGE’S GATE</text>
  <text x="510" y="46">WHAT THE DRIVER DOES</text>
  <text x="870" y="46">WHO FINISHES IT</text>
</g>
<line x1="320" y1="56" x2="1110" y2="56" stroke="#CBB8A4" stroke-width="1.4"/>

<!-- source -->
<rect x="40" y="207" width="210" height="80" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/>
<rect x="40" y="207" width="6" height="80" rx="3" fill="#F0A33A"/>
<text x="62" y="239" font-size="16" fill="#3B2A1E">A stage whose</text>
<text x="62" y="261" font-size="16" fill="#3B2A1E">dependencies are done</text>

<!-- spine -->
<path d="M250 247h40" stroke="#8A7664" stroke-width="2" fill="none"/>
<line x1="290" y1="105" x2="290" y2="390" stroke="#8A7664" stroke-width="2"/>
<g stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)">
  <path d="M290 105h24"/><path d="M290 200h24"/><path d="M290 295h24"/><path d="M290 390h24"/>
</g>

<!-- the driver does not stop -->
<path d="M290 402C236 402 236 93 284 93" stroke="#B59A80" stroke-width="1.8" fill="none" stroke-dasharray="6 5" marker-end="url(#a2)"/>
<text x="62" y="330" font-size="13" fill="#8A7664" font-style="italic">the driver moves on to the</text>
<text x="62" y="348" font-size="13" fill="#8A7664" font-style="italic">next stage either way</text>

<!-- ============ row 1 : auto ============ -->
<rect x="320" y="87" width="150" height="36" rx="9" fill="#FFFFFF" stroke="#F0A33A" stroke-width="1.6"/>
<text x="395" y="111" font-size="14.5" fill="#A2691F" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gate: auto</text>
<path d="M470 105h32" stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<rect x="510" y="69" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/>
<rect x="510" y="69" width="6" height="72" rx="3" fill="#4FB98C"/>
<text x="532" y="97" font-size="15.5" fill="#3B2A1E">Fired as its own session — works,</text>
<text x="532" y="119" font-size="15.5" fill="#3B2A1E">opens the stage PR, merges it</text>
<path d="M830 105h32" stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<rect x="870" y="81" width="240" height="48" rx="10" fill="#EAF7F1" stroke="#4FB98C" stroke-width="1.6"/>
<text x="990" y="110" font-size="15.5" fill="#2F7D5E" text-anchor="middle">the driver, unattended</text>

<!-- ============ row 2 : human ============ -->
<rect x="320" y="182" width="150" height="36" rx="9" fill="#FFFFFF" stroke="#F0A33A" stroke-width="1.6"/>
<text x="395" y="206" font-size="14.5" fill="#A2691F" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gate: human</text>
<path d="M470 200h32" stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<rect x="510" y="164" width="320" height="72" rx="12" fill="#FFFDF9" stroke="#D8B88A" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="532" y="192" font-size="15.5" fill="#3B2A1E">Skipped, never started —</text>
<text x="532" y="214" font-size="13.5" fill="#8A7664" font-style="italic">your judgment is part of the stage</text>
<path d="M830 200h32" stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<rect x="870" y="176" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#C9563C" stroke-width="1.6"/>
<text x="990" y="205" font-size="15.5" fill="#C9563C" text-anchor="middle">you, in a local session</text>

<!-- ============ row 3 : local ============ -->
<rect x="320" y="277" width="150" height="36" rx="9" fill="#FFFFFF" stroke="#F0A33A" stroke-width="1.6"/>
<text x="395" y="301" font-size="14.5" fill="#A2691F" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gate: local</text>
<path d="M470 295h32" stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<rect x="510" y="259" width="320" height="72" rx="12" fill="#FFFDF9" stroke="#D8B88A" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="532" y="287" font-size="15.5" fill="#3B2A1E">Skipped, never started —</text>
<text x="532" y="309" font-size="13.5" fill="#8A7664" font-style="italic">it needs something only your machine has</text>
<path d="M830 295h32" stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<rect x="870" y="271" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#C9563C" stroke-width="1.6"/>
<text x="990" y="300" font-size="15.5" fill="#C9563C" text-anchor="middle">you, on this machine</text>

<!-- ============ row 4 : live ============ -->
<rect x="320" y="372" width="150" height="36" rx="9" fill="#FFF1EC" stroke="#C9563C" stroke-width="1.8"/>
<text x="395" y="396" font-size="14.5" fill="#B0442B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gate: live</text>
<path d="M470 390h32" stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<rect x="510" y="354" width="320" height="72" rx="12" fill="#FFFDF9" stroke="#C9563C" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="532" y="382" font-size="15.5" fill="#3B2A1E">Never fired by any driver —</text>
<text x="532" y="404" font-size="13.5" fill="#8A7664" font-style="italic">it changes a running system; one at a time</text>
<path d="M830 390h32" stroke="#8A7664" stroke-width="2" fill="none" marker-end="url(#a2)"/>
<rect x="870" y="366" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#C9563C" stroke-width="1.6"/>
<text x="990" y="395" font-size="15.5" fill="#C9563C" text-anchor="middle">you, when you choose</text>

</g>
</svg>
