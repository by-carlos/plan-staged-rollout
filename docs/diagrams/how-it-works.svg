<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="1150" height="820" role="img" aria-label="How plan-staged-rollout works: four phases, what you say, what the plugin does, and what lands in the repo, with the rework loop.">
<title>How plan-staged-rollout works</title>
<desc>Four phases left to right: Brainstorm, Plan, Build, Close. Three lanes show what you say, what the plugin does, and what lands in the repo. A rework loop sends in-scope findings back to Build, large ones to a new plan, and small ones to create-issue then work-issue. A bracket strip across the top maps the phases to the classic software lifecycle.</desc>

<rect x="0" y="0" width="1150" height="820" fill="#F8EFE4"/>
<rect x="1" y="1" width="1148" height="818" fill="none" stroke="#E2D2BE" stroke-width="2"/>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A7664"/>
  </marker>
  <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9563C"/>
  </marker>

  <!-- quiet monoline glyphs, 18x18 -->
  <g id="g-bulb" fill="none" stroke="#B59A80" stroke-width="1.5" stroke-linecap="round">
    <path d="M9 1.6a5.4 5.4 0 0 0-3.2 9.7V13h6.4v-1.7A5.4 5.4 0 0 0 9 1.6z"/>
    <path d="M6.6 15h4.8M7.5 17h3"/>
  </g>
  <g id="g-list" fill="none" stroke="#B59A80" stroke-width="1.5" stroke-linecap="round">
    <rect x="2.2" y="2.2" width="13.6" height="13.6" rx="2.4"/>
    <path d="M5.4 6.6h7.2M5.4 9.6h7.2M5.4 12.6h4.2"/>
  </g>
  <g id="g-layers" fill="none" stroke="#B59A80" stroke-width="1.5" stroke-linejoin="round">
    <path d="M9 1.8 16.2 6 9 10.2 1.8 6z"/>
    <path d="M1.8 9.6 9 13.8l7.2-4.2M1.8 13.2 9 17.4l7.2-4.2"/>
  </g>
  <g id="g-check" fill="none" stroke="#B59A80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="9" r="7.2"/>
    <path d="M5.6 9.2 8 11.6l4.4-4.8"/>
  </g>
  <g id="g-doc" fill="none" stroke="#B59A80" stroke-width="1.4" stroke-linejoin="round">
    <path d="M4 1.8h6l4 4v10.4H4z"/>
    <path d="M10 1.8v4h4"/>
  </g>
  <g id="g-pr" fill="none" stroke="#B59A80" stroke-width="1.4" stroke-linecap="round">
    <circle cx="4.6" cy="4.2" r="2.2"/><circle cx="4.6" cy="14" r="2.2"/><circle cx="13.4" cy="14" r="2.2"/>
    <path d="M4.6 6.4v5.4M13.4 11.8V8.2a2.4 2.4 0 0 0-2.4-2.4H7.2"/>
  </g>
  <g id="g-issue" fill="none" stroke="#C9A05E" stroke-width="1.5">
    <circle cx="9" cy="9" r="7"/><circle cx="9" cy="9" r="1.9" fill="#C9A05E" stroke="none"/>
  </g>
</defs>

<g font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">

<!-- ================= SDLC bracket strip ================= -->
<g fill="#8A7664" font-size="12" letter-spacing="1.2" text-anchor="end">
  <text x="112" y="34">SOFTWARE</text>
  <text x="112" y="49">LIFECYCLE</text>
</g>
<g font-size="15.5" fill="#6F5B49" text-anchor="middle">
  <text x="375" y="36">Planning · Analysis · Design</text>
  <text x="753" y="36">Implementation · Deployment</text>
  <text x="1005" y="36">Maintenance</text>
  <text x="879" y="72" font-size="14" font-style="italic">Testing — in each stage, and again at the final review</text>
</g>
