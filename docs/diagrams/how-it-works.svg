  <line x1="627" y1="178" x2="627" y2="478"/>
  <line x1="879" y1="178" x2="879" y2="478"/>
</g>

<!-- ================= gutter lane labels ================= -->
<g fill="#8A7664" font-size="12" letter-spacing="1.2" text-anchor="end">
  <text x="112" y="200">YOU</text><text x="112" y="215">SAY</text>
  <text x="112" y="298">PSR</text><text x="112" y="313">DOES</text>
  <text x="112" y="420">WHAT</text><text x="112" y="435">LANDS</text>
</g>

<!-- ================= LANE 1 — you say ================= -->
<g fill="#FFFFFF" stroke="#C9563C" stroke-width="1.5">
  <rect x="132" y="182" width="234" height="52" rx="10"/>
  <rect x="384" y="182" width="234" height="52" rx="10"/>
  <rect x="636" y="182" width="234" height="52" rx="10"/>
  <rect x="888" y="182" width="234" height="52" rx="10"/>
</g>
<g fill="#C9563C" text-anchor="middle">
  <text x="249" y="202" font-size="15">“I need…”</text>
  <text x="249" y="222" font-size="15">“I have this issue…”</text>
  <text x="501" y="214" font-size="17">“What? How?”</text>
  <text x="753" y="214" font-size="17">“Run the next stage.”</text>
  <text x="1005" y="214" font-size="17">“Is this in scope?”</text>
</g>

<!-- ================= LANE 2 — PSR does ================= -->
<g>
  <rect x="132" y="254" width="234" height="104" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/><rect x="132" y="254" width="6" height="104" rx="3" fill="#F0A33A"/>
  <rect x="384" y="254" width="234" height="104" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/><rect x="384" y="254" width="6" height="104" rx="3" fill="#F0A33A"/>
  <rect x="636" y="254" width="234" height="104" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/><rect x="636" y="254" width="6" height="104" rx="3" fill="#F0A33A"/>
  <rect x="888" y="254" width="234" height="104" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/><rect x="888" y="254" width="6" height="104" rx="3" fill="#F0A33A"/>
</g>
<!-- c1 -->
<text x="154" y="280" font-size="17" fill="#3B2A1E">Brainstorm the idea</text>
<rect x="154" y="292" width="198" height="26" rx="8" fill="#FFF8EE" stroke="#D8B88A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="164" y="310" font-size="12.5" fill="#A2691F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">superpowers:brainstorming</text>
<text x="154" y="340" font-size="13.5" fill="#8A7664" font-style="italic">complementary, not required</text>
<!-- c2 -->
<text x="406" y="284" font-size="17" fill="#3B2A1E">Split it into stages</text>
<text x="406" y="314" font-size="15" fill="#A2691F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/plan-stages</text>
<text x="406" y="340" font-size="13" fill="#8A7664" font-style="italic">dependency-ordered, with a brief</text>
<!-- c3 -->
<text x="658" y="280" font-size="17" fill="#3B2A1E">One fresh session</text>
<text x="658" y="300" font-size="17" fill="#3B2A1E">per stage</text>
<text x="658" y="326" font-size="15" fill="#A2691F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/stage-run ×N</text>
<text x="658" y="348" font-size="15" fill="#A2691F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/plan-run</text>
<text x="752" y="348" font-size="13" fill="#8A7664" font-style="italic">drives them all</text>
<!-- c4 -->
<text x="910" y="280" font-size="17" fill="#3B2A1E">Final review stage —</text>
<text x="910" y="300" font-size="17" fill="#3B2A1E">reads the whole ledger</text>
<text x="910" y="334" font-size="15" fill="#A2691F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/plan-close</text>

<!-- ================= LANE 3 — what lands ================= -->
<g>
  <rect x="132" y="378" width="234" height="100" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/><rect x="132" y="378" width="6" height="100" rx="3" fill="#4FB98C"/>
  <rect x="384" y="378" width="234" height="100" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/><rect x="384" y="378" width="6" height="100" rx="3" fill="#4FB98C"/>
