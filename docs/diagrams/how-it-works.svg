  <text x="430" y="428">.plan/PLAN.md</text>
  <text x="430" y="450">.plan/LEDGER.md</text>
  <text x="430" y="472">.plan/stage-N-*.md</text>
</g>
<!-- c3 -->
<text x="658" y="406" font-size="15.5" fill="#3B2A1E">code · docs</text>
<text x="658" y="428" font-size="15.5" fill="#3B2A1E">tests · diagrams</text>
<use href="#g-doc" x="658" y="438"/>
<text x="682" y="452" font-size="14" fill="#2F7D5E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DECISIONS.md</text>
<use href="#g-pr" x="658" y="458"/>
<text x="682" y="472" font-size="13.5" fill="#2F7D5E">one PR per stage</text>
<!-- c4 -->
<use href="#g-pr" x="910" y="396"/>
<text x="934" y="410" font-size="15.5" fill="#3B2A1E">Final PR into <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2F7D5E">main</tspan></text>
<use href="#g-doc" x="910" y="430"/>
<text x="934" y="444" font-size="14" fill="#2F7D5E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lessons.md</text>
<text x="910" y="468" font-size="13" fill="#8A7664" font-style="italic">the blunt retro</text>

