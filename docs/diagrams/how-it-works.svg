  <rect x="888" y="378" width="234" height="100" rx="12" fill="#FFFFFF" stroke="#E6D5C2"/><rect x="888" y="378" width="6" height="100" rx="3" fill="#4FB98C"/>
</g>
<!-- c1 -->
<text x="154" y="420" font-size="15.5" fill="#3B2A1E">Idea + solution design</text>
<text x="154" y="444" font-size="13" fill="#8A7664" font-style="italic">what the solution actually is</text>
<!-- c2 -->
<use href="#g-doc" x="406" y="392"/>
<g font-size="14" fill="#2F7D5E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
